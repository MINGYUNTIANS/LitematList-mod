plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.16.3'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        url = uri("https://masa.dy.fi/maven/sakura-ryoko")
    }
    maven {
        url = uri("https://maven.fallenbreath.me/releases")
    }
    // Terraformers Maven（Mod Menu）
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    // Maven Central（pinyin4j 拼音库）
    mavenCentral()
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // MaLib (Sakura-Ryoko fork)
    modImplementation "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}"

    // Litematica
    modImplementation "fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version}:${project.litematica_version}"

    // conditional-mixin (MaLib/Litematica 传递依赖，打包进模组)
    modImplementation "me.fallenbreath:conditional-mixin-fabric:0.6.4"
    include "me.fallenbreath:conditional-mixin-fabric:0.6.4"

    // Mod Menu (compileOnly)
    modCompileOnly "com.terraformersmc:modmenu:15.0.2"

    // pinyin4j：中文物品名拼音模糊搜索支持（打包进模组 jar）
    include(modImplementation("com.belerweb:pinyin4j:2.5.1"))
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

task runNbtAnalyzer(type: JavaExec) {
    group = "diagnostics"
    description = "Analyze NBT structure of litematic files in build/example"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.litematlist.NbtAnalyzer"
    workingDir = project.projectDir
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {}
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}