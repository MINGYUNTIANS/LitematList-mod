plugins {
	id 'maven-publish'
	id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
	id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT' apply false

	// https://github.com/ReplayMod/preprocessor
	// https://github.com/Fallen-Breath/preprocessor
	id 'com.replaymod.preprocess' version 'c5abb4fb12'
}

preprocess {
	strictExtraMappings = false

	// 版本号第二个参数为预处理器使用的 MC 数值（1.21.10 -> 12110，26.1.2 -> 260102）
	def mc1171  = createNode('1.17.1', 1_17_01, '')
	def mc1194  = createNode('1.19.4', 1_19_04, '')
	def mc1201  = createNode('1.20.1', 1_20_01, '')
	def mc1211  = createNode('1.21.1', 1_21_01, '')
	def mc1214  = createNode('1.21.4', 1_21_04, '')
	def mc1218  = createNode('1.21.8', 1_21_08, '')
	def mc12110 = createNode('1.21.10', 1_21_10, '')
	def mc12111 = createNode('1.21.11', 1_21_11, '')
	def mc2601  = createNode('26.1.2', 26_01_02, '')
	def mc2602  = createNode('26.2', 26_02_00, '')
	def mc2603  = createNode('26.3', 26_03_00, '')

	// 版本链：上游节点的源码会派生到下游节点。
	// Yarn 版本共用 src/main/java，26.x 在 versions/<版本>/src/main/java 中覆盖。
	mc1171 .link(mc1194 , null)
	mc1194 .link(mc1201 , null)
	mc1201 .link(mc1211 , null)
	mc1211 .link(mc1214 , null)
	mc1214 .link(mc1218 , null)
	mc1218 .link(mc12110, null)
	mc12110.link(mc12111, null)
	mc12111.link(mc2601 , null)
	mc2601 .link(mc2602 , null)
	mc2602 .link(mc2603 , null)

	for (final def node in getNodes()) {
		findProject(node.project).ext.mcVersion = node.mcVersion
	}
}

// 依次构建全部版本，并把各子项目的 jar 汇总到根项目的 build/libs
tasks.register('buildAndGather') {
	subprojects {
		dependsOn project.tasks.named('build').get()
	}
	doFirst {
		println 'Gathering builds'
		def buildLibs = {
			p -> p.buildDir.toPath().resolve('libs')
		}
		delete fileTree(buildLibs(rootProject)) {
			include '*'
		}
		subprojects {
			copy {
				from(buildLibs(project)) {
					include '*.jar'
					exclude '*-dev.jar', '*-sources.jar', '*-shadow.jar'
				}
				into buildLibs(rootProject)
				duplicatesStrategy = DuplicatesStrategy.INCLUDE
			}
		}
	}
}

// 构建成功后自动部署到对应版本的 PCL 实例（先清理旧的 litematlist jar）
tasks.register('deployToInstances') {
	def instancesRoot = file(project.findProperty('instancesDir') ?: 'E:/PCL/.minecraft/versions')
	def instanceByMcVersion = [
		'1.17.1' : '1.17.1-Fabric_0.10.0.208',
		'1.19.4' : '1.19.4-Fabric_0.15.4',
		'1.20.1' : '1.20.1-Fabric 0.15.11',
		'1.21'   : '1.21.1-Fabric 0.19.3',
		'1.21.4' : '1.21.4-Fabric',
		'1.21.8' : '1.21.8 (Fabric)  v1 kx',
		'1.21.10': '1.21.10-Fabric',
		'1.21.11': '1.21.11-Fabric',
		'26.1.2' : '26.1.2-Fabric 0.19.3',
		'26.2'   : '26.2-Fabric_0.19.5',
		'26.3'   : '26.3-Fabric 0.19.5',
	]
	doLast {
		def gatherState = tasks.named('buildAndGather').get().state
		if (!gatherState.executed || gatherState.failure != null) {
			logger.warn('构建未成功，跳过部署')
			return
		}
		def libsDir = rootProject.buildDir.toPath().resolve('libs').toFile()
		instanceByMcVersion.each { mcVer, instanceName ->
			def jar = libsDir.listFiles()?.find {
				it.name.startsWith("${project.archives_base_name}-") &&
				it.name.endsWith("-mc${mcVer}.jar")
			}
			if (jar == null) {
				logger.warn("部署跳过：未找到 mc${mcVer} 的 jar")
				return
			}
			def modsDir = new File(instancesRoot, "${instanceName}/mods")
			if (!modsDir.isDirectory()) {
				logger.warn("部署跳过：实例目录不存在 ${modsDir}")
				return
			}
			modsDir.listFiles()?.findAll {
				it.isFile() && it.name.startsWith(project.archives_base_name) && it.name.endsWith('.jar')
			}?.each { it.delete() }
			java.nio.file.Files.copy(jar.toPath(), new File(modsDir, jar.name).toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			logger.lifecycle("已部署 ${jar.name} -> ${modsDir}")
		}
	}
}

tasks.named('buildAndGather') {
	finalizedBy 'deployToInstances'
}
